# Verso's adjustments to detekt's default rules. buildUponDefaultConfig is on: every rule and
# key not named here keeps its default. Each entry says why it differs.
#
# The keys are detekt 2.0.0-alpha.6's (its default-detekt-config.yml); config validation is on,
# so a key an upgrade renamed fails the build instead of being ignored. Check them on upgrade.

config:
  # A warning is a finding, like the compiler's (CLAUDE.md, "Warnings are errors").
  warningsAsErrors: true

style:
  MaxLineLength:
    # The code wraps at about 150 columns; 120 would flag two files in five and no reader
    # would gain from it.
    maxLineLength: 150
  ReturnCount:
    # The hard rules are guard clauses ("not loaded: return", "no permit: return"); a function
    # that checks them first is the point, not a smell.
    excludeGuardClauses: true

naming:
  PackageNaming:
    # The package is the applicationId's, com.github.reygnn.verso_launcher, fixed for good:
    # the underscore is allowed, or every file is a finding.
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'
