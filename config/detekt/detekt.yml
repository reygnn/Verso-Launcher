# Guru's adjustments to detekt's default rules — Verso's config/detekt/detekt.yml, minus
# its HomeStyle.kt exception. buildUponDefaultConfig is on: every rule and key not named
# here keeps its default.
#
# The keys are detekt 2.0.0-alpha.6's; config validation is on, so a key an upgrade
# renamed fails the build instead of being ignored. Check them on upgrade.

config:
  # A warning is a finding, like the compiler's.
  warningsAsErrors: true

style:
  MaxLineLength:
    # Verso's limit: the hosts wrap at about 150 columns.
    maxLineLength: 150
  ReturnCount:
    # Guard clauses first is the point, not a smell.
    excludeGuardClauses: true
