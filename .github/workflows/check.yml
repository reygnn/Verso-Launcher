name: check

# Every push and pull request: the same gate as locally — unit tests (JVM and Robolectric), lint
# and detekt, warnings as errors (CLAUDE.md, "Stack particulars") — and Guru's own suite from the
# subtree, whose code is compiled into the APK but whose tests otherwise run only in its repo.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21 end to end; Robolectric needs it for SDK 36.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: ./gradlew check
        run: ./gradlew check --stacktrace

      # guru/ is a self-contained Gradle build (git subtree); its check is its tag gate.
      - name: guru — ./gradlew check
        working-directory: guru
        run: ./gradlew check --stacktrace

      # On failure: the test, lint and detekt reports.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            guru/library/build/reports/
            guru/sample/build/reports/
            guru/library/build/test-results/
