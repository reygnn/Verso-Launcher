# Robolectric config for ALL Robolectric unit tests in this module.
#
# sdk: Robolectric 4.16.1 ships android-all jars up to API 36, and the app is
# minSdk = targetSdk = 36 (compileSdk 37), so this matches the one and only level
# the app runs at. Without the pin Robolectric runs at the manifest's targetSdk; the
# pin keeps a later targetSdk bump from asking for a jar 4.16.1 does not ship — the
# tests stay on 36 until this line is updated deliberately.
sdk=36

# No `application=` override on purpose: Robolectric instantiates the manifest's
# VersoApp, a new one per test, which installs Guru. Guru queues its look at the
# exit records and its save on the IO executor (Robolectric reports no exits, so
# nothing is saved): every Robolectric test starts the IO thread. And it sets its
# uncaught-exception handler, one per JVM (a second install keeps it). On the JVM
# there is no handler before it to hand a crash on to, so an exception escaping
# any background thread of a test halts the whole test worker (Runtime.halt, exit
# status 1) instead of failing that test — Gradle shows only the worker's exit.
# Nothing of it carries state from one test to the next — no ACRA, no Timber, no
# CoroutineScope — unlike the sister launcher whose properties file pins one for
# exactly that reason.
