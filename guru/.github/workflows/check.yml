name: check

# Every push and pull request: the same gate as locally — unit tests (JVM and
# Robolectric), lint and detekt, for library/ and sample/, all with warnings as
# errors (CLAUDE.md, "Build").
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21 end to end; Robolectric needs it for SDK 36.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: ./gradlew check
        run: ./gradlew check --stacktrace

      # On failure: the test, lint and detekt reports.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            library/build/reports/
            sample/build/reports/
            library/build/test-results/
            sample/build/test-results/
